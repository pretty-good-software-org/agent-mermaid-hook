name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: read

env:
  MISE_ENV: ci

jobs:
  Test:
    name: Test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      # LW-11 (2026-11-26): no mise cache on self-hosted X64 VMs (restore ~24s vs cold install 9–11s);
      # save only from the default branch.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: ${{ !(runner.environment == 'self-hosted' && runner.os == 'Linux' && runner.arch == 'X64') }}
          cache_save: >-
            ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
                github.event_name != 'pull_request_target' }}
          version: 2026.7.7
          install: true
          github_token: ${{ github.token }}
      - env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun install --frozen-lockfile
      - run: mise run test:default

  Build:
    name: Build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: ${{ !(runner.environment == 'self-hosted' && runner.os == 'Linux' && runner.arch == 'X64') }}
          cache_save: >-
            ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
                github.event_name != 'pull_request_target' }}
          version: 2026.7.7
          install: true
          github_token: ${{ github.token }}
      - env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun install --frozen-lockfile
      - run: bun run build

  commit-lint:
    name: Conventional Commits
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: ${{ !(runner.environment == 'self-hosted' && runner.os == 'Linux' && runner.arch == 'X64') }}
          cache_save: >-
            ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
                github.event_name != 'pull_request_target' }}
          version: 2026.7.7
          install: true
          github_token: ${{ github.token }}
      - env:
          FROM: ${{ github.event.pull_request.base.sha }}
          TO: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          git config user.name >/dev/null 2>&1 || {
            git config user.name "ci"
            git config user.email "ci@localhost"
          }
          git rev-list --no-merges --reverse "${FROM}..${TO}" | while read -r sha; do
            cog verify "$(git log -1 --format=%B "$sha")" || exit 1
          done
