name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

env:
  MISE_ENV: ci

# One live run per ref — a new push supersedes the queued/running one
# instead of piling up when runners are saturated or offline.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      # LW-11 (2026-11-26): no mise cache on self-hosted X64 VMs (restore ~24s vs cold install 9–11s);
      # save only from the default branch.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: ${{ !(runner.environment == 'self-hosted' && runner.os == 'Linux' && runner.arch == 'X64') }}
          cache_save: >-
            ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
                github.event_name != 'pull_request_target' }}
          version: 2026.7.7
          install: true
          github_token: ${{ github.token }}
      - env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun install --frozen-lockfile
      # Canonical lint entrypoint: mise run lint:default.
      - run: mise run lint:default
