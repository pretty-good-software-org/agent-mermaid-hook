name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

env:
  MISE_ENV: ci

# One live run per ref — a new push supersedes the queued/running one
# instead of piling up when runners are saturated or offline.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: pretty-good-software-org/ci-shared/actions/setup/mise@d849c5eec90735f14291eb9a0e61733ed38cfb38 # v1
        with:
          mise-env: ci
      - env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun install --frozen-lockfile
      # Canonical lint entrypoint: mise run lint:default.
      - run: mise run lint:default
